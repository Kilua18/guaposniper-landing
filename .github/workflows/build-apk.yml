name: Build APK

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          sdkmanager --licenses <<< "$(yes)"

      - name: Verify SDK setup
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/platforms/ || true
          ls -la $ANDROID_HOME/build-tools/ || true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --info 2>&1 | tail -200

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GuapoTerminal-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
